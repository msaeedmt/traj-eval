[project]
name = "traj-eval"
version = "0.1.0"
description = "Trajectory-level evaluation framework for multi-agent scientific reasoning (NLP Lab, CAISA Lab, Uni Bonn, SS2026)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jiadong Han" },
    { name = "Mohammad Saeed Motevali Amin" },
]
dependencies = [
    "pydantic>=2.7",
    "networkx>=3.3",        # directed interaction graph G
    "numpy>=1.26",
    "scipy>=1.13",          # paired bootstrap, stats protocol (P4)
    "orjson>=3.10",         # fast JSONL read/write
]

# Substrate / agent deps are kept in an optional group because they are heavy
# and only needed when actually running trials, not when developing the core.
[project.optional-dependencies]
agents = [                  # AutoGen / AG2 substrate [12]
    "ag2[openai]>=0.13,<0.14",
]
lean = [                    # in-loop Lean compiler tool (Step 4e); needs a Lean
    "lean-interact>=0.3",   # toolchain + a built project (e.g. ~/lean_anchor)
]
dashboard = [
    "streamlit>=1.36",      # O1 trajectory dashboard (built last)
    "plotly>=5.22",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traj_eval"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# sensible, not overbearing: pyflakes, pycodestyle, isort, bugbear, comprehensions, pyupgrade
select = ["E", "F", "I", "B", "C4", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
filterwarnings = [
    "ignore:jsonschema.RefResolver is deprecated:DeprecationWarning:autogen.json_utils",
    "ignore:Accessing jsonschema.__version__ is deprecated:DeprecationWarning:autogen.import_utils",
]
